name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Confere token e conta antes do deploy e explica o problema em
      # português se algo estiver errado. Nunca imprime o token.
      - name: Verificar credenciais da Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          [ -n "$CF_TOKEN" ]   || fail "Segredo CLOUDFLARE_API_TOKEN não existe ou está vazio."
          [ -n "$CF_ACCOUNT" ] || fail "Segredo CLOUDFLARE_ACCOUNT_ID não existe ou está vazio."
          case "$CF_TOKEN$CF_ACCOUNT" in
            *[[:space:]]*) fail "Um dos segredos tem espaço ou quebra de linha. Recrie-o colando o valor sem espaços." ;;
          esac

          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }

          verify=$(api /user/tokens/verify)
          if [ "$(echo "$verify" | jq -r .success)" != "true" ]; then
            verify=$(api "/accounts/$CF_ACCOUNT/tokens/verify")
          fi
          echo "Token: $(echo "$verify" | jq -c '{success, status: .result.status, errors}')"
          [ "$(echo "$verify" | jq -r .result.status)" = "active" ] \
            || fail "O token é inválido, expirou ou foi desativado. Crie um novo com o modelo 'Edit Cloudflare Workers'."

          scripts=$(api "/accounts/$CF_ACCOUNT/workers/scripts")
          echo "Acesso a Workers: $(echo "$scripts" | jq -c '{success, errors}')"
          [ "$(echo "$scripts" | jq -r .success)" = "true" ] \
            || fail "O token não acessa os Workers da conta $CF_ACCOUNT. Confira se o CLOUDFLARE_ACCOUNT_ID está certo e se o token foi criado com o modelo 'Edit Cloudflare Workers', com essa conta em 'Account Resources'."

          echo "Credenciais OK."

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          command: deploy
